# Bundle manifest read by tools/validate.py. Add a category or section here before using it in wiki/.
manifest_version: 1
okf_version: '0.2'
slug: nis2
name: NIS2 Knowledge Base
description: Directive (EU) 2022/2555 (NIS2), its implementing acts, national transpositions, authorities and guidance.
extension_key: x-nis2
categories:
- law
- requirement
- guidance
- standard
- role
- procedure
- authority
- jurisdiction
- timeline
- glossary
- sector
sections:
- path: law
  title: Law
  description: Directive (EU) 2022/2555 article by article, its annexes, Implementing Regulation (EU) 2024/2690 and later
    acts, and interacting EU law (CRA, CER, DORA, GDPR, Cybersecurity Act).
- path: obligations
  title: Obligations
  description: 'Role and lifecycle views: who is an essential or important entity, governance duties, Article 21 risk-management
    measures, Article 23 reporting clocks, registration, supply-chain security and jurisdiction.'
- path: sectors
  title: Sectors
  description: Annex I sectors of high criticality and Annex II other critical sectors, with the entity types each sector
    covers.
- path: authorities
  title: Authorities
  description: 'EU-level bodies: competent authorities as a role, single points of contact, CSIRTs and the CSIRTs network,
    the NIS Cooperation Group, EU-CyCLONe, ENISA and the European vulnerability database.'
- path: guidance
  title: Guidance
  description: 'Official non-binding guidance: ENISA technical implementation guidance, NIS Cooperation Group documents, Commission
    guidelines and FAQs, national authority guidance.'
- path: standards
  title: Standards
  description: Standards the directive, the implementing regulation and national schemes refer to (ISO/IEC 27001, IEC 62443,
    ETSI EN 319 401 and others), recorded as identifiers, lifecycle facts and links.
- path: jurisdictions
  title: Jurisdictions
  description: Every EU Member State's transposing law, competent authorities, CSIRT, registration deadline and penalty framework,
    plus EEA status.
- path: timeline
  title: Timeline
  description: Entry into force, transposition deadline, implementing-regulation application, national registration and reporting
    dates, review clauses.
- path: glossary
  title: Glossary
  description: Terms defined in Article 6 of Directive (EU) 2022/2555.
